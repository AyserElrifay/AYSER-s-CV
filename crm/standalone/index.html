<style>
  :root {
    /* Twelve brand system — ink teal, sage, warm cream */
    --bg: #f4f0e4;
    --surface: #ffffff;
    --surface-2: #eae3d0;
    --text: #17302a;
    --muted: #74796d;
    --border: #e3dcc7;
    --border-strong: #d3c8ab;
    --accent: #17302a;
    --accent-contrast: #f4f0e4;
    --accent-soft: #e3e6da;
    --ok: #3f6b4a;
    --ok-soft: #e4ebe0;
    --warn: #8c6a2e;
    --warn-soft: #f0e6d0;
    --sold: #8b9188;
    --sold-soft: #e9e7dd;
    --danger: #6b2e22;
    --danger-soft: #f0dfd8;
    --shadow: 0 1px 2px rgba(23,48,42,.05), 0 2px 6px rgba(23,48,42,.05);
    --shadow-pop: 0 10px 32px rgba(23,48,42,.14);
    --radius: 10px;
    --sans: "Segoe UI", system-ui, -apple-system, "Noto Sans Arabic", "Noto Kufi Arabic", "Tahoma", sans-serif;
    --serif: Georgia, "Times New Roman", "Noto Serif", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10231f; --surface: #17322c; --surface-2: #1e3e36;
      --text: #efeadd; --muted: #93a395; --border: #2a463e; --border-strong: #375b50;
      --accent: #efeadd; --accent-contrast: #17302a; --accent-soft: #23433a;
      --ok: #6fa57d; --ok-soft: #1e3a29; --warn: #c7a35c; --warn-soft: #3a2f19;
      --sold: #93a395; --sold-soft: #22322c; --danger: #c97a64; --danger-soft: #3d211a;
      --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-pop: 0 10px 32px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #10231f; --surface: #17322c; --surface-2: #1e3e36;
    --text: #efeadd; --muted: #93a395; --border: #2a463e; --border-strong: #375b50;
    --accent: #efeadd; --accent-contrast: #17302a; --accent-soft: #23433a;
    --ok: #6fa57d; --ok-soft: #1e3a29; --warn: #c7a35c; --warn-soft: #3a2f19;
    --sold: #93a395; --sold-soft: #22322c; --danger: #c97a64; --danger-soft: #3d211a;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-pop: 0 10px 32px rgba(0,0,0,.45);
  }
  :root[data-theme="light"] {
    --bg: #f4f0e4; --surface: #ffffff; --surface-2: #eae3d0;
    --text: #17302a; --muted: #74796d; --border: #e3dcc7; --border-strong: #d3c8ab;
    --accent: #17302a; --accent-contrast: #f4f0e4; --accent-soft: #e3e6da;
    --ok: #3f6b4a; --ok-soft: #e4ebe0; --warn: #8c6a2e; --warn-soft: #f0e6d0;
    --sold: #8b9188; --sold-soft: #e9e7dd; --danger: #6b2e22; --danger-soft: #f0dfd8;
    --shadow: 0 1px 2px rgba(23,48,42,.05), 0 2px 6px rgba(23,48,42,.05); --shadow-pop: 0 10px 32px rgba(23,48,42,.14);
  }

  * { box-sizing: border-box; }
  svg { width: 14px; height: 14px; flex-shrink: 0; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--sans); direction: rtl;
    -webkit-font-smoothing: antialiased; line-height: 1.5;
    font-size: 14px;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 14px; }
  a { color: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* Layout */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 258px; flex-shrink: 0; background: var(--surface-2);
    border-inline-start: 1px solid var(--border); position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; padding: 14px 12px;
  }
  .brand { display: flex; align-items: center; gap: 11px; padding: 6px 8px 16px; }
  .brand-mark { width: 34px; height: 34px; flex-shrink: 0; color: var(--text); display: grid; place-items: center; }
  .brand-mark svg { width: 100%; height: 100%; overflow: visible; }
  .brand-name { font-family: var(--serif); font-weight: 700; font-size: 17px; letter-spacing: .06em; direction: ltr; text-align: start; }
  .brand-sub { font-size: 11px; color: var(--muted); }
  .num-display { font-family: var(--serif); font-variant-numeric: tabular-nums; }
  .nav { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .nav-label { font-size: 11px; color: var(--muted); padding: 8px 8px 4px; font-weight: 600; letter-spacing: .02em; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 13.5px; border: none; background: none; width: 100%; text-align: start; transition: background .12s, color .12s; }
  .nav-item:hover { background: var(--surface); color: var(--text); }
  .nav-item.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
  .nav-item.active svg { color: var(--accent); }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  [data-icon] { display: inline-flex; }
  .sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
  .sb-user { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 14px; }
  .topbar h1 { font-size: 17px; margin: 0; font-weight: 650; }
  .topbar .sub { font-size: 12.5px; color: var(--muted); }
  .top-actions { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; }
  .content { padding: 22px 24px 60px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid transparent; font-size: 13.5px; font-weight: 550; background: var(--accent); color: var(--accent-contrast); transition: opacity .12s, background .12s; }
  .btn:hover { opacity: .88; }
  .btn svg { width: 16px; height: 16px; }
  .btn.sm { height: 34px; padding: 0 11px; font-size: 12.5px; }
  .btn.outline { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
  .btn.outline:hover { background: var(--surface-2); opacity: 1; }
  .btn.ghost { background: none; color: var(--muted); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--text); }
  .btn.danger { background: none; color: var(--danger); border-color: transparent; }
  .btn.danger:hover { background: var(--danger); color: var(--bg); }
  .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); }
  .icon-btn:hover { color: var(--text); background: var(--surface-2); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* Cards & grids */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .grid { display: grid; gap: 12px; }
  .kpis { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  .kpi { padding: 15px 16px; }
  .kpi .lbl { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .kpi .lbl svg { width: 17px; height: 17px; color: var(--muted); }
  .kpi .val { font-size: 25px; font-weight: 700; margin-top: 7px; }
  .kpi .hint { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .kpi .hint.up { color: var(--ok); }

  .section-title { font-size: 15px; font-weight: 650; margin: 26px 0 12px; }

  /* Today's task rows — the app's answer to "what do I do now?" */
  .task { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--border); }
  .task:first-child { border-top: none; }
  .task:hover { background: var(--surface-2); }
  .task-rank { width: 4px; align-self: stretch; border-radius: 999px; flex-shrink: 0; }
  .task-rank.r1 { background: var(--danger); }
  .task-rank.r2 { background: var(--warn); }
  .task-rank.r3 { background: var(--sold); }
  .task-main { flex: 1; min-width: 0; border: none; background: none; text-align: start; padding: 0; display: flex; flex-direction: column; gap: 2px; color: inherit; }
  .task-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-why { font-size: 11.5px; color: var(--muted); }
  .task-acts { display: flex; gap: 6px; flex-shrink: 0; }
  .task-acts .icon-btn { text-decoration: none; }

  /* Badges / chips */
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 550; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.sold { background: var(--sold-soft); color: var(--sold); }
  .badge.danger { background: var(--danger-soft); color: var(--danger); }
  .badge.outline { border: 1px solid var(--border-strong); color: var(--muted); }
  .chip { border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); padding: 6px 12px; border-radius: 999px; font-size: 12.5px; transition: .12s; }
  .chip:hover { color: var(--text); background: var(--surface-2); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }

  /* Empty state */
  .empty { text-align: center; padding: 54px 20px; border: 1px dashed var(--border-strong); border-radius: var(--radius); background: var(--surface); }
  .empty .em-ic { width: 52px; height: 52px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin: 0 auto 14px; }
  .empty .em-ic svg { width: 26px; height: 26px; }
  .empty .em-ic.mark { width: 60px; height: 60px; background: none; color: var(--text); }
  .empty .em-ic.mark svg { width: 100%; height: 100%; }
  .empty h3 { margin: 0 0 6px; font-size: 16px; }
  .empty p { margin: 0 auto 16px; color: var(--muted); max-width: 380px; font-size: 13px; }

  /* Table */
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead { background: var(--surface-2); }
  th { text-align: start; font-weight: 600; font-size: 12px; color: var(--muted); padding: 11px 14px; white-space: nowrap; }
  td { padding: 12px 14px; border-top: 1px solid var(--border); }
  tbody tr:hover { background: var(--surface-2); }

  /* Company cards */
  .co-card { padding: 18px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .co-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .co-logo { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 17px; }
  .co-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 16px; text-align: center; }
  .co-stat { background: var(--surface-2); border-radius: 9px; padding: 9px 4px; }
  .co-stat .n { font-size: 16px; font-weight: 700; }
  .co-stat .l { font-size: 11px; color: var(--muted); }

  /* Unit cards */
  .units-grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .unit { border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; transition: box-shadow .15s; }
  .unit:hover { box-shadow: var(--shadow-pop); }
  .unit.sold { opacity: .62; }
  .unit-media { height: 96px; display: flex; align-items: flex-end; justify-content: space-between; padding: 10px 12px; position: relative; }
  .unit-body { padding: 13px 14px; }
  .unit-title { font-weight: 650; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .unit-title:hover { color: var(--accent); }
  .unit-meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
  .unit-price { font-size: 15.5px; font-weight: 700; }
  .unit-plan { font-size: 11px; color: var(--accent); margin-top: 2px; }
  .unit-verify { font-size: 10.5px; margin-top: 8px; display: flex; align-items: center; gap: 4px; }
  .unit-verify .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .unit-verify svg { width: 14px; height: 14px; flex-shrink: 0; }
  .media-btn { position: absolute; width: 30px; height: 30px; border-radius: 50%; border: none; display: grid; place-items: center; background: rgba(255,255,255,.92); color: var(--text); box-shadow: var(--shadow); }
  .media-btn.fav-on { color: var(--danger); }
  .media-btn svg { width: 15px; height: 15px; }

  /* Drawer */
  .modal.drawer { justify-self: end; align-self: stretch; height: 100vh; max-height: 100vh; border-radius: 0; display: flex; flex-direction: column; border-inline-start: 1px solid var(--border); }
  .modal.drawer .modal-body { flex: 1; overflow-y: auto; }
  .modal.wide { max-width: 760px; }
  .plan-box { background: var(--surface-2); border-radius: 10px; padding: 14px; }
  .plan-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; }
  .plan-row.total { border-top: 1px solid var(--border-strong); margin-top: 4px; padding-top: 9px; font-weight: 700; font-size: 14px; }
  .hint-note { font-size: 11.5px; color: var(--muted); background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 8px 10px; display: flex; align-items: flex-start; gap: 6px; }
  .hint-note svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; }

  /* Kanban */
  .board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .col { width: 264px; flex-shrink: 0; display: flex; flex-direction: column; }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px 8px; }
  .col-dot { width: 9px; height: 9px; border-radius: 50%; }
  .col-name { font-size: 13px; font-weight: 650; }
  .col-count { background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 600; }
  .col-body { flex: 1; min-height: 120px; background: var(--surface-2); border: 1px solid transparent; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 8px; transition: .12s; }
  .col-body.drag-over { border-color: var(--accent); background: var(--accent-soft); }
  .lead { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; box-shadow: var(--shadow); cursor: grab; }
  .lead:active { cursor: grabbing; }
  .lead.dragging { opacity: .4; }
  .lead-open { display: flex; flex-direction: column; gap: 2px; width: 100%; border: none; background: none; padding: 0; text-align: start; color: inherit; }
  .lead-name { font-weight: 600; font-size: 13.5px; }
  .lead-sub { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .lead-budget { font-size: 12px; font-weight: 600; margin-top: 4px; }
  .lead-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .lead-age { font-size: 11px; color: var(--muted); }
  .lead-age.stale { color: var(--warn); font-weight: 600; }
  .icon-btn.sm { width: 32px; height: 32px; text-decoration: none; }
  .icon-btn.sm svg { width: 15px; height: 15px; }
  .col-add { border: none; background: none; color: var(--muted); font-size: 12px; padding: 7px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .col-add:hover { background: var(--surface); color: var(--text); }

  /* Filters bar */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 22px; padding: 12px 14px; }
  .fgroup { display: flex; align-items: center; gap: 8px; }
  .fgroup > span { font-size: 12px; font-weight: 600; color: var(--muted); }
  .fchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .divider-v { width: 1px; height: 22px; background: var(--border); }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(20,20,19,.42); backdrop-filter: blur(2px); display: grid; place-items: center; z-index: 100; padding: 20px; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .modal { width: 100%; max-width: 480px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-pop); max-height: 90vh; overflow-y: auto; transform: translateY(6px); transition: transform .15s; }
  .overlay.open .modal { transform: none; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border); }
  .modal-head h2 { margin: 0; font-size: 16px; }
  .modal-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-start; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--text); }
  .field .req { color: var(--danger); }
  .control { height: 38px; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 9px; padding: 0 11px; color: var(--text); width: 100%; }
  textarea.control { height: auto; padding: 9px 11px; resize: vertical; min-height: 64px; }
  .control:focus, .chip:focus-visible, .btn:focus-visible, .nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg-opt { flex: 1; min-width: 90px; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 9px; padding: 8px; font-size: 12.5px; text-align: center; color: var(--muted); }
  .seg-opt.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .toast { position: fixed; inset-block-end: 22px; inset-inline-start: 50%; transform: translateX(50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow-pop); opacity: 0; pointer-events: none; transition: .2s; z-index: 200; }
  .toast.show { opacity: 1; transform: translateX(50%) translateY(0); }

  .meter { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
  .save-note { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }

  /* Mobile bottom navigation — replaces the sidebar on narrow screens */
  .mnav { display: none; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 860px) {
    .sidebar { display: none; }
    .content { padding: 14px 14px 84px; }
    .topbar { padding: 12px 14px; gap: 10px; }
    .topbar h1 { font-size: 15.5px; }
    .topbar .sub { display: none; }
    .row2 { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    /* an odd last tile would orphan in a 2-up grid — let it span instead */
    .kpis > :last-child:nth-child(odd) { grid-column: span 2; }
    .units-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .modal:not(.drawer) { max-width: 100%; }
    .bar { gap: 10px 14px; padding: 10px 12px; }
    .fgroup > span { display: none; }

    .mnav {
      display: flex; position: fixed; inset-inline: 0; bottom: 0; z-index: 50;
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 16px rgba(23,48,42,.08);
    }
    .mnav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      border: none; background: none; color: var(--muted); font-size: 10.5px; padding: 6px 2px;
      border-radius: 8px;
    }
    .mnav-item svg { width: 20px; height: 20px; }
    .mnav-item.active { color: var(--accent); font-weight: 600; }
  }
</style>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" id="brandMark"></div>
      <div>
        <div class="brand-name">TWELVE</div>
        <div class="brand-sub">استشارات عقارية</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-label">الإدارة</div>
      <button class="nav-item" data-view="dashboard"><span data-icon="grid"></span><span>اليوم</span></button>
      <button class="nav-item" data-view="companies"><span data-icon="building"></span><span>الشركات</span></button>
      <div class="nav-label">التنفيذ</div>
      <button class="nav-item" data-view="inventory"><span data-icon="store"></span><span>سوق العقارات</span></button>

/* ---- icon set: inline SVGs, no external requests ---- */

function hydrateIcons(root=document){ root.querySelectorAll("[data-icon]").forEach(el=>{ const name=el.getAttribute("data-icon"); if(I[name]) el.innerHTML=I[name]; }); }

/* ---- Twelve compass mark: disc + 4-point star + bezel ticks ----
   Two-tone by design: the disc is drawn in currentColor, the star is
   "cut out" in the surrounding surface color, so it inverts correctly
   between light and dark theme automatically. */
function compassMark(cutoutVar){
  cutoutVar = cutoutVar || "--surface-2";
  const ticks = Array.from({ length: 12 }, (_, i) => {
    const a = (i * 30 - 90) * Math.PI / 180;
    const x1 = (50 + 41 * Math.cos(a)).toFixed(1), y1 = (54 + 41 * Math.sin(a)).toFixed(1);
    const x2 = (50 + 46 * Math.cos(a)).toFixed(1), y2 = (54 + 46 * Math.sin(a)).toFixed(1);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  }).join("");
  return `<svg viewBox="0 0 100 100" style="overflow:visible">
    <g stroke="currentColor" stroke-width="2.5" stroke-linecap="round">${ticks}</g>
    <circle cx="50" cy="54" r="40" fill="currentColor"/>
    <path d="M50,15 L59,45 L89,54 L59,63 L50,93 L41,63 L11,54 L41,45 Z" style="fill:var(${cutoutVar})"/>
  </svg>`;
}

const STORE_KEY = "aqar_crm_v1";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

let state = load();
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { companies: [], units: [], leads: [] };
}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

/* ---- reference values (choices, not data) ---- */
const CO_COLORS = ["#17302a","#6b2e22","#8c6a2e","#3f5a52","#4a3a5c","#5c4a2e","#2e4a4a","#6b4a3a"];

const STAGES = [
  { id:"new", name:"جديد", color:"#2e7cf6" },
  { id:"contacted", name:"تم التواصل", color:"#7c3aed" },
  { id:"qualified", name:"مؤهّل", color:"#0ea5a4" },

];

/* ---- format helpers ---- */
const nf = new Intl.NumberFormat("en-US");
function fmtNum(n){ return nf.format(Math.round(n||0)); }
function fmtEGP(n){
  n = Number(n)||0;
  if (n >= 1e6) { const m = n/1e6; return (m%1===0?m:m.toFixed(1))+" مليون ج.م"; }
  if (n >= 1000) return fmtNum(Math.round(n/1000))+" ألف ج.م";
  return n ? fmtNum(n)+" ج.م" : "—";
}
function initials(s){ const p=(s||"").trim().split(/\s+/); return (p[0]?.[0]||"")+(p[1]?.[0]||""); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function coById(id){ return state.companies.find(c=>c.id===id); }
function coColor(id){ const c=coById(id); return c?c.color:"#8a877f"; }
function coName(id){ const c=coById(id); return c?c.name:"—"; }

/* ---- payment plan calculator (Nawy-style: down payment % + years) ---- */
function paymentPlan(u){
  const price = Number(u.price)||0;
  const dpPct = Number(u.downPaymentPct)||0;
  const years = Number(u.installmentYears)||0;
  const downPayment = Math.round(price * dpPct/100);
  const remaining = price - downPayment;
  const months = years*12;
  const monthly = months>0 ? Math.round(remaining/months) : 0;
  return { price, dpPct, downPayment, remaining, years, months, monthly, isCash: years<=0 };
}

/* ---- freshness / verification badge (Bayut TruCheck-style, computed from a REAL timestamp) ---- */
function verificationInfo(u){
  const ts = u.lastVerifiedAt || u.createdAt || Date.now();
  const days = Math.max(0, Math.floor((Date.now()-ts)/86400000));
  const when = days<1 ? "اليوم" : days===1 ? "منذ يوم" : `منذ ${days} يوم`;
  if (days>30) return { tone:"danger", label:`غير مؤكدة — ${when}`, days };
  if (days>7)  return { tone:"warn",   label:`يُنصح بالمراجعة — ${when}`, days };
  return { tone:"ok", label:`تم تأكيد التوفر ${when}`, days };
}

/* ---- one-tap contact actions (a salesperson's most-used verbs) ---- */
function telHref(phone){
  const p = String(phone||"").replace(/[^\d+]/g,"");
  return p ? "tel:"+p : null;
}
function waHref(phone){
  let p = String(phone||"").replace(/[^\d]/g,"");
  if (!p) return null;
  if (p.startsWith("00")) p = p.slice(2);          // 0020... -> 20...
  else if (p.startsWith("0")) p = "20" + p.slice(1); // local Egyptian 010... -> 2010...
  return "https://wa.me/"+p;
}

/* ---- "اليوم": what actually needs doing, derived from real timestamps only.
   Never invents urgency — every row states the fact it is based on. ---- */
const DAY_MS = 86400000;
function leadLastTouch(l){ return l.updatedAt || l.createdAt || Date.now(); }
function daysSince(ts){ return Math.max(0, Math.floor((Date.now()-ts)/DAY_MS)); }

function todayTasks(){
  const tasks = [];
  state.leads.forEach(l=>{
    const days = daysSince(leadLastTouch(l));
    if (l.stage === "new"){
      tasks.push({ rank:1, id:l.id, kind:"lead", name:l.name, phone:l.phone,
        why: days<1 ? "عميل جديد — تواصل معه اليوم" : `عميل جديد منذ ${days} يوم — لم يتم التواصل`,
        days });
    } else if (l.stage!=="won" && l.stage!=="lost" && days>=3){
      const stage = STAGES.find(s=>s.id===l.stage);
      tasks.push({ rank:2, id:l.id, kind:"lead", name:l.name, phone:l.phone,
        why:`في «${stage?stage.name:l.stage}» بدون تحديث منذ ${days} يوم`, days });
    }
  });
  state.units.forEach(u=>{
    if (u.status === "sold") return;
    const v = verificationInfo(u);
    if (v.days > 30){
      tasks.push({ rank:3, id:u.id, kind:"unit",
        name:[u.project, u.code].filter(Boolean).join(" · ") || "وحدة",
        why:`لم يتم تأكيد توفرها منذ ${v.days} يوم`, days:v.days });
    }
  });
  return tasks.sort((a,b)=> a.rank-b.rank || b.days-a.days);
}

/* ---- AI price hint: derived ONLY from the user's own real entered units, never fabricated ---- */
function areaTypeBenchmark(area, type, excludeId){
  const matches = state.units.filter(u=>u.id!==excludeId && u.area===area && u.type===type && Number(u.sqm)>0 && Number(u.price)>0);
  if (matches.length<2) return null;
  const avg = matches.reduce((s,u)=>s+Number(u.price)/Number(u.sqm),0)/matches.length;
  return { avgPricePerM: Math.round(avg), count: matches.length };
}

const SORTERS = {
  newest:     (a,b)=> (b.createdAt||0)-(a.createdAt||0),
  price_asc:  (a,b)=> (Number(a.price)||0)-(Number(b.price)||0),
  price_desc: (a,b)=> (Number(b.price)||0)-(Number(a.price)||0),
  delivery:   (a,b)=> deliveryRank(a)-deliveryRank(b),
};
function deliveryRank(u){ return u.readyToMove!==false ? 0 : (Number(u.deliveryYear)||9999); }

/* =====================================================================
   DASHBOARD
===================================================================== */
function renderDashboard(){
  const { companies, units, leads } = state;
  if (!companies.length && !units.length && !leads.length){
    return emptyState(compassMark("--surface"), "ابدأ بإضافة بياناتك",
      "لا توجد بيانات وهمية هنا. أضف شركتك الأولى، ثم مخزونها وعملاءها — كل شيء يُحفظ في متصفحك.",
      `<button class="btn" data-act="add-company">${I.plus} إضافة شركة</button>
       <button class="btn outline" data-act="load-sample">تحميل بيانات مثال (اختياري)</button>`,
      "mark");
  }
  const avail = units.filter(u=>u.status==="available");
  const openLeads = leads.filter(l=>l.stage!=="won");
  const pipeline = openLeads.reduce((s,l)=>s+((Number(l.budgetMin)||0)+(Number(l.budgetMax)||0))/2,0);
  const tasks = todayTasks();

  // Three numbers that change what you do next. Nothing decorative.
  const leadTasks = tasks.filter(t=>t.kind==="lead").length;
  const kpis = [
    { lbl:"يحتاج متابعة", val:fmtNum(tasks.length), hint:`${fmtNum(leadTasks)} عميل · ${fmtNum(tasks.length-leadTasks)} وحدة` },
    { lbl:"عملاء مفتوحون", val:fmtNum(openLeads.length), hint:`${fmtNum(leads.length-openLeads.length)} صفقة مغلقة` },
    { lbl:"قيمة خط الأنابيب", val:fmtEGP(pipeline), hint:`${fmtNum(avail.length)} وحدة متاحة` },
  ];
  let html = `<div class="grid kpis">${kpis.map(k=>`
    <div class="card kpi">
      <div class="lbl">${esc(k.lbl)}</div>
      <div class="val tnum num-display">${k.val}</div>
      <div class="hint">${esc(k.hint)}</div>
    </div>`).join("")}</div>`;

  html += `<div class="section-title">مهام اليوم</div>`;
  if (!tasks.length){
    html += `<div class="card" style="padding:26px 18px;text-align:center">
      <div style="color:var(--ok);display:flex;justify-content:center;margin-bottom:8px">${I.check}</div>
      <div style="font-weight:600">لا توجد متابعات متأخرة</div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:3px">كل عملائك تمت متابعتهم، وكل الوحدات مؤكدة.</div>
    </div>`;
    return html;
  }

  html += `<div class="card" style="overflow:hidden">${tasks.map(t=>{
    const tel = t.kind==="lead" ? telHref(t.phone) : null;
    const wa  = t.kind==="lead" ? waHref(t.phone)  : null;
    const act = t.kind==="lead" ? "edit-lead" : "view-unit";
    return `<div class="task">
      <span class="task-rank r${t.rank}"></span>
      <button class="task-main" data-act="${act}" data-id="${t.id}">
        <span class="task-name">${esc(t.name)}</span>
        <span class="task-why">${esc(t.why)}</span>
      </button>
      <div class="task-acts">
        ${tel?`<a class="icon-btn" href="${tel}" title="اتصال" onclick="event.stopPropagation()">${I.phone}</a>`:""}
        ${wa?`<a class="icon-btn" href="${wa}" target="_blank" rel="noopener" title="واتساب" onclick="event.stopPropagation()">${I.chat}</a>`:""}
        ${t.kind==="unit"?`<button class="icon-btn" data-act="confirm-availability" data-id="${t.id}" title="تأكيد التوفر">${I.check}</button>`:""}
      </div>
    </div>`;
  }).join("")}</div>`;
  return html;
}

  if (!state.units.length){
    return emptyState(I.store, "لا يوجد مخزون بعد",
      "أضف الوحدات الحقيقية: المشروع، الكود، النوع، المساحة، السعر، والحالة (متاح/محجوز/مباع).",
      `<button class="btn" data-act="add-unit">${I.plus} إضافة وحدة</button>`);
  }
  const types = ["الكل", ...UNIT_TYPES.filter(t=>state.units.some(u=>u.type===t))];
  const companies = ["الكل", ...state.companies.map(c=>c.name)];
  const statuses = [["available","المتاح"],["all","الكل"],["reserved","المحجوز"],["sold","المباع"]];

  let list = state.units.filter(u=>
    (invFilter.type==="الكل"||u.type===invFilter.type) &&
    (invFilter.company==="الكل"||coName(u.companyId)===invFilter.company) &&
    (invFilter.status==="all"||u.status===invFilter.status) &&
    (!invFilter.favOnly || u.isFavorite)
  );
  list = list.slice().sort(SORTERS[invFilter.sort]||SORTERS.newest);

  const av = state.units.filter(u=>u.status==="available").length;
  const rv = state.units.filter(u=>u.status==="reserved").length;
  const sl = state.units.filter(u=>u.status==="sold").length;
  const favCount = state.units.filter(u=>u.isFavorite).length;

  let html = `<div class="card bar" style="margin-bottom:14px">
    <div style="display:flex;gap:18px;font-size:12.5px;align-items:center">
      <span style="color:var(--muted)">متاح <b class="tnum" style="color:var(--ok)">${av}</b></span>
      <span style="color:var(--muted)">محجوز <b class="tnum" style="color:var(--warn)">${rv}</b></span>
      <span style="color:var(--muted)">مباع <b class="tnum">${sl}</b></span>
    </div>
  </div>`;

  html += `<div class="card bar" style="margin-bottom:14px">
    <div class="fgroup"><span>النوع</span><div class="fchips">${types.map(t=>`<button class="chip ${invFilter.type===t?"on":""}" data-f="type" data-v="${esc(t)}">${esc(t)}</button>`).join("")}</div></div>
    <div class="divider-v"></div>
    <div class="fgroup"><span>الحالة</span><div class="fchips">${statuses.map(([v,l])=>`<button class="chip ${invFilter.status===v?"on":""}" data-f="status" data-v="${v}">${esc(l)}</button>`).join("")}</div></div>
    ${state.companies.length>1?`<div class="divider-v"></div><div class="fgroup"><span>الشركة</span><div class="fchips">${companies.map(c=>`<button class="chip ${invFilter.company===c?"on":""}" data-f="company" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div></div>`:""}
    ${favCount?`<div class="divider-v"></div><button class="chip ${invFilter.favOnly?"on":""}" data-f="favOnly" data-v="${!invFilter.favOnly}">${I.heart} المفضلة (${favCount})</button>`:""}
    <span style="margin-inline-start:auto;display:flex;align-items:center;gap:8px">
      <span class="tnum" style="font-size:12px;color:var(--muted)">${list.length} وحدة</span>
      <select class="control" id="sortSel" style="height:32px;width:auto;font-size:12.5px">${Object.entries(SORT_LABELS).map(([v,l])=>`<option value="${v}" ${invFilter.sort===v?"selected":""}>ترتيب: ${l}</option>`).join("")}</select>
    </span>
  </div>`;

  if (!list.length){
    html += `<div class="empty"><div class="em-ic">${I.filter}</div><h3>لا نتائج</h3><p>لا توجد وحدات مطابقة للفلترة الحالية.</p></div>`;
    return html;
  }

  html += `<div class="grid units-grid">${list.map((u,i)=>unitCard(u,i)).join("")}</div>`;
  return html;
}

function unitCard(u, i){
  const v = verificationInfo(u);
  const plan = paymentPlan(u);
  const statusBadge = u.status==="sold"?`<span class="badge sold" style="position:absolute;inset-inline-start:10px;top:10px">مباعة</span>`
    : u.status==="reserved"?`<span class="badge warn" style="position:absolute;inset-inline-start:10px;top:10px">محجوزة</span>`:"";
  return `<div class="unit ${u.status==="sold"?"sold":""}">
    <div class="unit-media" style="background:${GRADS[i%GRADS.length]}">
      <span class="badge" style="position:absolute;inset-inline-end:10px;top:10px;background:rgba(255,255,255,.85);color:#17302a">${esc(u.type)}</span>
      ${statusBadge}
      <button class="media-btn ${u.isFavorite?"fav-on":""}" style="inset-inline-start:10px;top:46px" data-act="toggle-fav" data-id="${u.id}" title="مفضلة">${I.heart}</button>
      <span style="font-size:12px;font-weight:600;color:#17302a;opacity:.75">${esc(u.code||"")}</span>
    </div>
    <div class="unit-body">
      <div class="unit-title" data-act="view-unit" data-id="${u.id}">${esc(u.project||"—")}</div>
      <div class="unit-meta">
        <span>${I.pin} ${esc(u.area||"—")}</span>
        <span style="width:9px;height:9px;border-radius:2px;background:${coColor(u.companyId)};align-self:center"></span>${esc(coName(u.companyId))}
      </div>
      <div class="unit-meta">
        ${u.sqm?`<span>${esc(u.sqm)} م²</span>`:""}
        ${u.bedrooms?`<span>${esc(u.bedrooms)} غرف</span>`:""}
        ${u.readyToMove===false?`<span>${I.calendar} ${u.deliveryYear?esc(u.deliveryYear):"تحت الإنشاء"}</span>`:`<span style="color:var(--ok)">جاهز للاستلام</span>`}
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:11px">
        <div>
          <div class="unit-price tnum num-display">${fmtEGP(u.price)}</div>
          ${!plan.isCash ? `<div class="unit-plan tnum">قسط من ${fmtEGP(plan.monthly)}/شهرياً</div>` : `<div class="unit-plan" style="color:var(--muted)">كاش بالكامل</div>`}
        </div>
        <div style="display:flex;gap:4px">
          <button class="icon-btn" style="width:30px;height:30px" data-act="edit-unit" data-id="${u.id}" title="تعديل">${I.edit}</button>
          <button class="icon-btn" style="width:30px;height:30px" data-act="del-unit" data-id="${u.id}" title="حذف">${I.trash}</button>
        </div>
      </div>
      <div class="unit-verify" style="color:var(--${v.tone})">
        <span class="dot" style="background:currentColor"></span>${esc(v.label)}
      </div>
    </div>
  </div>`;
}

/* =====================================================================
   LEADS (Kanban)
===================================================================== */
function renderLeads(){
  if (!state.companies.length){
    return emptyState(I.kanban, "أضف شركة أولاً",
      "العملاء لازم يكونوا تابعين لشركة. أضف شركة ثم ابدأ بإضافة العملاء.",
      `<button class="btn" data-act="add-company">${I.plus} إضافة شركة</button>`);
  }
  const board = STAGES.map(st=>{
    const items = state.leads.filter(l=>l.stage===st.id);
    const val = items.reduce((s,l)=>s+((Number(l.budgetMin)||0)+(Number(l.budgetMax)||0))/2,0);
    return `<div class="col">
      <div class="col-head">
        <span class="col-dot" style="background:${st.color}"></span>
        <span class="col-name">${st.name}</span>
        <span class="col-count tnum">${items.length}</span>
        <span style="margin-inline-start:auto;font-size:11px;color:var(--muted)" class="tnum">${val?fmtEGP(val):""}</span>
      </div>
      <div class="col-body" data-stage="${st.id}">
        ${items.map(l=>leadCard(l)).join("")}
        <button class="col-add" data-act="add-lead" data-stage="${st.id}">${I.plus} إضافة</button>
      </div>
    </div>`;
  }).join("");
  return `<div class="board">${board}</div>`;
}
function leadCard(l){
  const budget = (l.budgetMin||l.budgetMax)?`${fmtEGP(l.budgetMin)} – ${fmtEGP(l.budgetMax)}`:"";
  const tel = telHref(l.phone), wa = waHref(l.phone);
  const days = daysSince(leadLastTouch(l));
  return `<div class="lead" draggable="true" data-id="${l.id}">
    <button class="lead-open" data-act="edit-lead" data-id="${l.id}">
      <span class="lead-name">${esc(l.name)}</span>
      <span class="lead-sub">${I.pin} ${esc(l.area||"—")}</span>
      ${budget?`<span class="lead-budget tnum">${budget}</span>`:""}
    </button>
    <div class="lead-foot">
      <span class="lead-age ${days>=3?"stale":""}">${days<1?"اليوم":`منذ ${days} يوم`}</span>
      <div style="display:flex;gap:5px">
        ${tel?`<a class="icon-btn sm" href="${tel}" title="اتصال">${I.phone}</a>`:""}
        ${wa?`<a class="icon-btn sm" href="${wa}" target="_blank" rel="noopener" title="واتساب">${I.chat}</a>`:""}
        <button class="icon-btn sm" data-act="del-lead" data-id="${l.id}" title="حذف">${I.trash}</button>
      </div>
    </div>
  </div>`;
}

===================================================================== */
function emptyState(icon, title, body, actions, iconClass){
  return `<div class="empty"><div class="em-ic ${iconClass||""}">${icon}</div><h3>${esc(title)}</h3><p>${esc(body)}</p>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">${actions||""}</div></div>`;
}

function topActionsFor(view){
  const a = {
    dashboard: `<button class="btn sm" data-act="add-lead">${I.plus} عميل</button>`,
    companies: `<button class="btn sm" data-act="add-company">${I.plus} إضافة شركة</button>`,

/* =====================================================================
   EVENT WIRING
===================================================================== */
function wireView(){
  document.getElementById("topActions").innerHTML = topActionsFor(current);

  // filters
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{
    let v = b.dataset.v;
    if (v==="true") v=true; else if (v==="false") v=false;
    invFilter[b.dataset.f]=v; paint();
  });
  const sortSel = document.getElementById("sortSel");
  if (sortSel) sortSel.onchange = ()=>{ invFilter.sort=sortSel.value; paint(); };

  // Kanban drag & drop
  document.querySelectorAll(".lead[draggable]").forEach(card=>{
    card.addEventListener("dragstart", e=>{ e.dataTransfer.setData("id", card.dataset.id); card.classList.add("dragging"); });
    card.addEventListener("dragend", ()=> card.classList.remove("dragging"));
  });
  document.querySelectorAll(".col-body").forEach(col=>{
    col.addEventListener("dragover", e=>{ e.preventDefault(); col.classList.add("drag-over"); });
    col.addEventListener("dragleave", ()=> col.classList.remove("drag-over"));
    col.addEventListener("drop", e=>{
      e.preventDefault(); col.classList.remove("drag-over");
      const id=e.dataTransfer.getData("id"); const lead=state.leads.find(l=>l.id===id);
      if (lead && lead.stage!==col.dataset.stage){ lead.stage=col.dataset.stage; lead.updatedAt=Date.now(); save(); paint(); }
    });
  });
}

// Global click delegation for all [data-act]
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, stage = el.dataset.stage;
  if (act==="add-company") return openCompanyForm();
  if (act==="del-company") return delCompany(id);
  if (act==="add-unit") return openUnitForm();
  if (act==="edit-unit") return openUnitForm(id);
  if (act==="del-unit") return confirmDel("unit", id, "حذف هذه الوحدة؟");
  if (act==="view-unit") return openUnitDetail(id);
  if (act==="toggle-fav") return toggleFav(id);
  if (act==="pick-compare") return openComparePicker(id);
  if (act==="do-compare") return openCompareModal(id, el.dataset.other);
  if (act==="confirm-availability") return confirmAvailability(id);
  if (act==="copy-unit") return copyUnitSummary(id);
  if (act==="add-lead") return openLeadForm(null, stage);
  if (act==="edit-lead") return openLeadForm(id);
  if (act==="del-lead") return confirmDel("lead", id, "حذف هذا العميل؟");
  if (act==="load-sample") return loadSample();
  if (act==="close-modal") return closeModal();
});

function toggleFav(id){
  const u = state.units.find(x=>x.id===id); if(!u) return;
  u.isFavorite = !u.isFavorite; save(); paint();
  refreshUnitDetail(id);
}
function confirmAvailability(id){
  const u = state.units.find(x=>x.id===id); if(!u) return;
  u.lastVerifiedAt = Date.now(); save(); paint(); toast("تم تأكيد التوفر الآن");
  refreshUnitDetail(id);
}
function refreshUnitDetail(id){
  if (openUnitDetailId===id) openUnitDetail(id);
}
function copyUnitSummary(id){
  const u = state.units.find(x=>x.id===id); if(!u) return;
  const plan = paymentPlan(u);
  const lines = [
    `${u.project||""} — ${u.code||""}`,
    `${coName(u.companyId)} · ${u.area||""}`,
    `${u.type} · ${u.sqm||"—"} م² ${u.bedrooms?"· "+u.bedrooms+" غرف":""}`,
    `السعر: ${fmtEGP(u.price)}`,
    plan.isCash ? "كاش بالكامل" : `مقدم ${plan.dpPct}% (${fmtEGP(plan.downPayment)}) + قسط شهري ${fmtEGP(plan.monthly)} لمدة ${plan.years} سنة`,
    u.readyToMove===false ? `التسليم: ${u.deliveryYear||"تحت الإنشاء"}` : "جاهزة للاستلام فوراً",
  ];
  const text = lines.join("\n");
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(()=>toast("تم نسخ تفاصيل الوحدة")).catch(()=>toast("تعذّر النسخ"));
  else toast("النسخ غير مدعوم في هذا المتصفح");
}

document.querySelectorAll(".nav-item[data-view], .mnav-item[data-view]").forEach(b=> b.onclick=()=>go(b.dataset.view));

const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");
overlay.addEventListener("click", e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });
function openModal(html, variant){
  modal.className = "modal" + (variant?" "+variant:"");
  modal.innerHTML=html; overlay.classList.add("open");
  // Focus synchronously: a deferred focus can steal the caret from someone
  // who starts typing immediately after the dialog appears.
  const f=modal.querySelector("input,select,textarea"); if(f && !variant) f.focus();
}
function closeModal(){ overlay.classList.remove("open"); openUnitDetailId=null; }
let openUnitDetailId = null;

function areaDatalist(){
  const areas = [...new Set(state.units.map(u=>u.area).concat(state.leads.map(l=>l.area)).filter(Boolean))];
  return `<datalist id="areasDL">${areas.map(a=>`<option value="${esc(a)}">`).join("")}</datalist>`;
}
function companyOptions(sel){
  return state.companies.map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.name)}</option>`).join("");
}

/* ---- Company ---- */
function openCompanyForm(){
  openModal(`
    <div class="modal-head"><h2>إضافة شركة</h2><button class="icon-btn" data-act="close-modal">${I.x}</button></div>
    <form id="frm" class="modal-body">
      <div class="field"><label>اسم الشركة <span class="req">*</span></label><input class="control" name="name" required placeholder="مثال: النور للتطوير العقاري"></div>
      <div class="field"><label>النوع</label>
        <div class="seg" id="coType">
          <div class="seg-opt on" data-v="developer">مطوّر عقاري</div>
          <div class="seg-opt" data-v="brokerage">وسيط / تسويق</div>
        </div>
      </div>
      <div class="field"><label>المنطقة / النشاط</label><input class="control" name="area" placeholder="اختياري — مثال: التجمع الخامس"></div>
    </form>
    <div class="modal-foot">
      <button class="btn" id="saveBtn">حفظ الشركة</button>
      <button class="btn ghost" data-act="close-modal">إلغاء</button>
    </div>`);
  let type="developer";
  modal.querySelectorAll("#coType .seg-opt").forEach(o=>o.onclick=()=>{ type=o.dataset.v; modal.querySelectorAll("#coType .seg-opt").forEach(x=>x.classList.toggle("on",x===o)); });
  modal.querySelector("#saveBtn").onclick=()=>{
    const f=modal.querySelector("#frm"); if(!f.name.value.trim()) return f.name.focus();
    state.companies.push({ id:uid(), name:f.name.value.trim(), type, area:f.area.value.trim(), color:CO_COLORS[state.companies.length%CO_COLORS.length], createdAt:Date.now() });
    save(); closeModal(); paint(); toast("تم حفظ الشركة");
  };
}
function delCompany(id){
  const c=coById(id); const nU=state.units.filter(u=>u.companyId===id).length, nL=state.leads.filter(l=>l.companyId===id).length;
  confirmAction(`حذف «${c.name}»؟`, nU||nL?`سيُحذف أيضاً ${nU} وحدة و${nL} عميل تابعين لها.`:"لا توجد بيانات تابعة لها.", ()=>{
    state.companies=state.companies.filter(c=>c.id!==id);
    state.units=state.units.filter(u=>u.companyId!==id);
    state.leads=state.leads.filter(l=>l.companyId!==id);
    save(); paint(); toast("تم الحذف");
  });
}

    const plan = paymentPlan({price, downPaymentPct:dp, installmentYears:years});
    modal.querySelector("#planPreview").innerHTML = plan.isCash
      ? `<div class="plan-row" style="color:var(--muted)">سيُعرض كدفعة كاش بالكامل</div>`
      : `<div class="plan-row"><span>المقدم</span><span class="tnum">${fmtEGP(plan.downPayment)}</span></div>
         <div class="plan-row total"><span>القسط الشهري التقديري</span><span class="tnum">${fmtEGP(plan.monthly)}</span></div>`;
  }
  function refreshPriceHint(){
    const area=f.area.value.trim(), type=f.type.value, sqm=+f.sqm.value||0;
    const bench = area && sqm>0 ? areaTypeBenchmark(area, type, u?u.id:null) : null;
    const hintEl = modal.querySelector("#priceHint");
    if (!bench){ hintEl.innerHTML=""; return; }
    hintEl.innerHTML = `<div class="hint-note" style="margin-top:6px">${I.sparkle}<span>متوسط سعر المتر لنفس النوع في «${esc(area)}» من بياناتك: <b>${fmtNum(bench.avgPricePerM)} ج.م/م²</b> (${bench.count} وحدة)</span></div>`;
  }
  ["price","downPaymentPct","installmentYears"].forEach(n=>f[n].addEventListener("input", refreshPlanPreview));
  ["area","sqm","price"].forEach(n=>f[n].addEventListener("input", refreshPriceHint));
  f.type.addEventListener("change", refreshPriceHint);
  refreshPlanPreview(); refreshPriceHint();

  modal.querySelector("#saveBtn").onclick=()=>{
    const f=modal.querySelector("#frm");
    if(!f.price.value) return f.price.focus();
    const data={ companyId:f.companyId.value, project:f.project.value.trim(), code:f.code.value.trim(), type:f.type.value,
      sqm:+f.sqm.value||0, bedrooms:+f.bedrooms.value||0, area:f.area.value.trim(), price:+f.price.value||0, status,
      finishing:f.finishing.value, readyToMove:ready, deliveryYear:ready?null:(+f.deliveryYear.value||null),
      downPaymentPct:+f.downPaymentPct.value||0, installmentYears:+f.installmentYears.value||0 };
    if (u){ Object.assign(u,data); } else { state.units.push({ id:uid(), ...data, isFavorite:false, lastVerifiedAt:Date.now(), createdAt:Date.now() }); }
    save(); closeModal(); paint(); toast(u?"تم حفظ التعديل":"تمت إضافة الوحدة");
  };
}

/* ---- Unit detail drawer ---- */
function openUnitDetail(id){
  const u = state.units.find(x=>x.id===id); if(!u) return;
  openUnitDetailId = id;
  const v = verificationInfo(u);
  const plan = paymentPlan(u);
  const bench = areaTypeBenchmark(u.area, u.type, u.id);
  const statusLabel = u.status==="available"?"متاحة":u.status==="reserved"?"محجوزة":"مباعة";
  const statusVariant = u.status==="available"?"ok":u.status==="reserved"?"warn":"sold";

  let benchHtml = "";
  if (bench && Number(u.sqm)>0){
    const myPricePerM = Math.round(Number(u.price)/Number(u.sqm));
    const diffPct = Math.round(((myPricePerM - bench.avgPricePerM)/bench.avgPricePerM)*100);
    const cmp = diffPct===0 ? "مطابق لمتوسط بياناتك" : diffPct>0 ? `أعلى بـ ${diffPct}% من متوسط بياناتك` : `أقل بـ ${Math.abs(diffPct)}% من متوسط بياناتك`;
    benchHtml = `<div class="hint-note">${I.sparkle}<div>سعر المتر هنا ${fmtNum(myPricePerM)} ج.م — <b>${cmp}</b> لنفس النوع في «${esc(u.area)}» (من ${bench.count} وحدة أدخلتها بنفسك).</div></div>`;
  }

  openModal(`
    <div class="modal-head">
      <h2>${esc(u.project||"وحدة")} <span style="color:var(--muted);font-weight:400">· ${esc(u.code||"")}</span></h2>
      <button class="icon-btn" data-act="close-modal">${I.x}</button>
    </div>
    <div class="modal-body" id="unitDetailBody">
      <div class="unit-media" style="background:${GRADS[0]};border-radius:10px;height:120px">
        <span class="badge" style="position:absolute;inset-inline-end:10px;top:10px;background:rgba(255,255,255,.85);color:#17302a">${esc(u.type)}</span>
        <span class="badge ${statusVariant}" style="position:absolute;inset-inline-start:10px;top:10px">${statusLabel}</span>
      </div>

      <div class="plan-box">
        <div class="plan-row"><span>السعر الإجمالي</span><b class="tnum">${fmtEGP(u.price)}</b></div>
        ${plan.isCash ? `<div class="plan-row" style="color:var(--muted)">دفع كاش بالكامل</div>` : `
          <div class="plan-row"><span>المقدم (${plan.dpPct}%)</span><span class="tnum">${fmtEGP(plan.downPayment)}</span></div>
          <div class="plan-row"><span>باقي الأقساط (${plan.years} سنة)</span><span class="tnum">${fmtEGP(plan.remaining)}</span></div>
          <div class="plan-row total"><span>القسط الشهري</span><span class="tnum">${fmtEGP(plan.monthly)}</span></div>
        `}
      </div>

      ${benchHtml}

      <div class="unit-verify" style="color:var(--${v.tone});font-size:12px">
        ${I.clock}<span>${esc(v.label)}</span>
      </div>
      <button class="btn outline sm" data-act="confirm-availability" data-id="${u.id}">${I.check} تأكيد التوفر الآن</button>

      <div style="display:flex;flex-direction:column;gap:9px;font-size:13px">
        <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">الشركة</span><span>${esc(coName(u.companyId))}</span></div>
        <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">المنطقة</span><span>${esc(u.area||"—")}</span></div>
        <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">المساحة</span><span class="tnum">${u.sqm?u.sqm+" م²":"—"}</span></div>
        <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">الغرف</span><span class="tnum">${u.bedrooms||"—"}</span></div>
        <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">التشطيب</span><span>${esc(u.finishing||"—")}</span></div>

      </div>

      <div class="row2">
        <button class="btn ${u.isFavorite?"":"outline"} sm" data-act="toggle-fav" data-id="${u.id}">${I.heart} ${u.isFavorite?"في المفضلة":"أضف للمفضلة"}</button>

/* ---- Compare: pick a second unit, then show a 2-up table ---- */
function openComparePicker(id){
  const base = state.units.find(u=>u.id===id); if (!base) return;
  const others = state.units.filter(u=>u.id!==id);
  openModal(`
    <div class="modal-head"><h2>قارن «${esc(base.project||base.code||"الوحدة")}» بـ...</h2><button class="icon-btn" data-act="close-modal">${I.x}</button></div>
    <div class="modal-body" style="gap:8px">
      ${others.map(u=>`
        <button class="btn outline sm" style="justify-content:space-between;width:100%" data-act="do-compare" data-id="${id}" data-other="${u.id}">
          <span>${esc(u.project||u.code||"—")} · ${esc(u.code||"")}</span>
          <span class="tnum" style="color:var(--muted)">${fmtEGP(u.price)}</span>
        </button>`).join("")}
    </div>
    <div class="modal-foot"><button class="btn ghost" data-act="close-modal">إلغاء</button></div>`);
}

function openCompareModal(idA, idB){
  const units = [idA, idB].map(id=>state.units.find(u=>u.id===id)).filter(Boolean);
  if (units.length<2) return;
  const rows = [
    ["المشروع", u=>u.project||"—"],
    ["الشركة", u=>coName(u.companyId)],
    ["النوع", u=>u.type],
    ["المنطقة", u=>u.area||"—"],
    ["المساحة", u=>u.sqm?u.sqm+" م²":"—"],
    ["الغرف", u=>u.bedrooms||"—"],
    ["التشطيب", u=>u.finishing||"—"],
    ["التسليم", u=>u.readyToMove===false?(u.deliveryYear||"تحت الإنشاء"):"جاهزة"],
    ["السعر", u=>fmtEGP(u.price)],
    ["سعر المتر", u=>u.sqm?fmtNum(Math.round(u.price/u.sqm))+" ج.م":"—"],
    ["المقدم", u=>{ const p=paymentPlan(u); return p.isCash?"كاش":`${p.dpPct}% (${fmtEGP(p.downPayment)})`; }],
    ["القسط الشهري", u=>{ const p=paymentPlan(u); return p.isCash?"—":fmtEGP(p.monthly); }],
  ];
  openModal(`
    <div class="modal-head"><h2>مقارنة الوحدات</h2><button class="icon-btn" data-act="close-modal">${I.x}</button></div>
    <div class="modal-body">
      <div class="tbl-wrap"><table>
        <thead><tr><th></th>${units.map(u=>`<th>${esc(u.code||u.project||"—")}</th>`).join("")}</tr></thead>
        <tbody>
          ${rows.map(([label,fn])=>`<tr><td style="color:var(--muted);font-weight:600">${label}</td>${units.map(u=>`<td class="tnum">${esc(fn(u))}</td>`).join("")}</tr>`).join("")}
        </tbody>
      </table></div>
    </div>
    <div class="modal-foot"><button class="btn ghost" data-act="close-modal">إغلاق</button></div>`, "wide");
}

/* ---- delete / confirm ---- */
function confirmDel(kind, id, msg){
  confirmAction(msg, "لا يمكن التراجع.", ()=>{
    if(kind==="unit") state.units=state.units.filter(x=>x.id!==id);
    if(kind==="lead") state.leads=state.leads.filter(x=>x.id!==id);
    save(); paint(); toast("تم الحذف");
  });
}
function confirmAction(title, body, onYes){
  openModal(`<div class="modal-head"><h2>${esc(title)}</h2></div>
    <div class="modal-body"><p style="margin:0;color:var(--muted)">${esc(body)}</p></div>
    <div class="modal-foot"><button class="btn danger" id="yes" style="border-color:var(--danger)">نعم، احذف</button><button class="btn ghost" data-act="close-modal">إلغاء</button></div>`);
  modal.querySelector("#yes").onclick=()=>{ onYes(); closeModal(); };
}

/* =====================================================================
   DATA MENU (export / import / clear) + THEME
===================================================================== */
document.getElementById("themeBtn").onclick = toggleTheme;
function toggleTheme(){
  const root=document.documentElement;
  const isDark = (root.getAttribute("data-theme")||"") === "dark" || (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", isDark?"light":"dark");
  localStorage.setItem("aqar_theme", isDark?"light":"dark");
  updateThemeLabel();
}
function updateThemeLabel(){
  const root=document.documentElement;
  const isDark = (root.getAttribute("data-theme")||"") === "dark" || (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  const btn=document.getElementById("themeBtn");
  btn.innerHTML = (isDark?I.sun:I.moon)+`<span>${isDark?"الوضع النهاري":"الوضع الليلي"}</span>`;
}
(function initTheme(){ const t=localStorage.getItem("aqar_theme"); if(t) document.documentElement.setAttribute("data-theme",t); })();

document.getElementById("dataBtn").onclick = ()=>{
  const count = state.companies.length+state.units.length+state.leads.length;
  openModal(`<div class="modal-head"><h2>بياناتي</h2><button class="icon-btn" data-act="close-modal">${I.x}</button></div>
    <div class="modal-body">
      <div class="save-note">${I.shield} بياناتك محفوظة في هذا المتصفح فقط. صدّرها لعمل نسخة احتياطية أو نقلها لجهاز آخر.</div>
      <div style="background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:13px" class="tnum">
        ${state.companies.length} شركة · ${state.units.length} وحدة · ${state.leads.length} عميل
      </div>
      <button class="btn outline" id="exportBtn">${I.download} تصدير نسخة (JSON)</button>
      <label class="btn outline" style="cursor:pointer">${I.upload} استيراد نسخة<input type="file" id="importFile" accept="application/json" hidden></label>
      <button class="btn danger" id="clearBtn" style="border-color:var(--danger)">${I.trash} مسح كل البيانات</button>
    </div>`);
  modal.querySelector("#exportBtn").onclick=exportData;
  modal.querySelector("#importFile").onchange=importData;
  modal.querySelector("#clearBtn").onclick=()=>confirmAction("مسح كل البيانات؟","سيُحذف كل ما أدخلته نهائياً من هذا المتصفح.",()=>{ state={companies:[],units:[],leads:[]}; save(); paint(); toast("تم مسح البيانات"); });
};
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`twelve-crm-${new Date().toISOString().slice(0,10)}.json`; a.click();
  toast("تم تصدير نسختك");
}
function importData(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
    if(d && Array.isArray(d.companies)){ state={companies:d.companies||[],units:d.units||[],leads:d.leads||[]}; save(); closeModal(); paint(); toast("تم استيراد بياناتك"); }
    else toast("ملف غير صالح");
  }catch(err){ toast("تعذّر قراءة الملف"); } };
  r.readAsText(file);
}
