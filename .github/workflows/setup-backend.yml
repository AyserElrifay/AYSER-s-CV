name: Set up Moments backend

# One button that finishes the backend, so nobody has to click through
# the Supabase dashboard by hand:
#
#   1. runs supabase/RUN_ME.sql against the database (story comments,
#      map covers, notification de-duping — all idempotent, safe twice)
#   2. deploys the bardi-chat Edge Function
#   3. sets its secrets (ALLOWED_ORIGIN, and GROQ_API_KEY if provided)
#   4. calls the function once for real and checks Bardi answers
#
# Manual only — this never fires on a push.
#
# Required repository secret:
#   SUPABASE_ACCESS_TOKEN  — Supabase → Account → Access Tokens →
#                            "Generate new token" (starts with sbp_)
# Optional repository secret:
#   GROQ_API_KEY           — free key from console.groq.com (gsk_...).
#                            Without it Bardi has no provider and the
#                            smoke test will say so plainly.
#
# Nothing here ever prints a secret: GitHub masks registered secrets in
# logs, and no step echoes a token or a key.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Supabase project ref'
        required: true
        default: 'dvddiyztpyyuultndzso'
      site_origin:
        description: 'Origin allowed to call bardi-chat (CORS)'
        required: true
        default: 'https://ayserelrifay.github.io'
      run_sql:
        description: 'Run supabase/RUN_ME.sql'
        type: boolean
        default: true
      auth_urls:
        description: 'Let the password-reset link come back to the app'
        type: boolean
        default: true
      app_url:
        description: 'Where the app lives (reset links return here)'
        required: true
        default: 'https://ayserelrifay.github.io/AYSER-s-CV/'
      deploy_function:
        description: 'Deploy the bardi-chat Edge Function'
        type: boolean
        default: true
      import_music:
        description: 'Import pre-1929 public-domain recordings'
        type: boolean
        default: false
      music_target:
        description: 'How many new tracks to import'
        required: false
        default: '1000'
      import_photos:
        description: 'Find public-domain photographs for the Egypt quiz'
        type: boolean
        default: false
      photos_dry_run:
        description: 'Photographs: look and report, write nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ inputs.project_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the access token is present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is missing."
            echo "Add it at Settings → Secrets and variables → Actions → New repository secret."
            echo "Get the value from https://supabase.com/dashboard/account/tokens"
            exit 1
          fi
          echo "Access token found."
          # What KIND of key it is — never the key. The two easiest
          # mistakes are pasting a project API key (sb_secret_/sb_publishable_
          # or a long eyJ... JWT) instead of the personal token, and a
          # stray space or line break from copying on a phone.
          t="$SUPABASE_ACCESS_TOKEN"
          trimmed="$(printf '%s' "$t" | tr -d '[:space:]')"
          echo "::add-mask::$trimmed"
          [ "$t" != "$trimmed" ] && echo "::warning::The saved key had spaces or a line break in it; they are stripped here."
          case "$trimmed" in
            sbp_*) echo "Looks right: a personal access token (sbp_…), ${#trimmed} characters." ;;
            sb_secret_*|sb_publishable_*) echo "::error::This is a PROJECT API key, not a personal access token. Make one at https://supabase.com/dashboard/account/tokens (it starts with sbp_)."; exit 1 ;;
            eyJ*) echo "::error::This is a project JWT key (anon or service_role), not a personal access token. Make one at https://supabase.com/dashboard/account/tokens (it starts with sbp_)."; exit 1 ;;
            *) echo "::warning::This does not start with sbp_ — personal access tokens do. ${#trimmed} characters." ;;
          esac
          echo "SUPABASE_ACCESS_TOKEN=$trimmed" >> "$GITHUB_ENV"

      # The Management API runs SQL with the account token, so the
      # database password is never needed here.
      - name: Run RUN_ME.sql on the database
        id: sql
        if: ${{ inputs.run_sql }}
        run: |
          set -euo pipefail
          jq -Rs '{query: .}' supabase/RUN_ME.sql > /tmp/q.json
          code=$(curl -sS -o /tmp/sql.out -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/q.json)
          echo "HTTP $code"
          # The response body is query output or a SQL error — never a secret.
          head -c 2000 /tmp/sql.out; echo
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::The SQL did not apply. The message above says why."
            exit 1
          fi
          echo "Schema applied."

      # A reset email's link is only honoured if its address is on the
      # project's allow list — otherwise Supabase sends people to the
      # Site URL instead and the app never sees the token. The list is
      # READ first and added to, never replaced: anything already on it
      # stays. SMTP is set too, but only if a RESEND_API_KEY secret and a
      # sender address exist — the built-in mailer is for testing and
      # sends only a handful of emails an hour.
      - name: Allow the reset link back into the app (and SMTP if set)
        id: auth
        if: ${{ inputs.auth_urls }}
        env:
          APP_URL: ${{ inputs.app_url }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$REF/config/auth"
          curl -sS -f "$api" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > /tmp/auth.json
          current=$(jq -r '.uri_allow_list // ""' /tmp/auth.json)
          site=$(jq -r '.site_url // ""' /tmp/auth.json)
          echo "site_url now: $site"
          echo "allow list now: ${current:-<empty>}"
          want="$APP_URL,${APP_URL}**"
          merged=$(printf '%s,%s' "$current" "$want" | tr ',' '\n' | sed '/^$/d' | awk '!seen[$0]++' | paste -sd, -)
          body=$(jq -n --arg l "$merged" '{uri_allow_list: $l}')
          if [ -z "$site" ] || echo "$site" | grep -q 'localhost'; then
            body=$(echo "$body" | jq --arg s "$APP_URL" '. + {site_url: $s}')
          fi
          if [ -n "${RESEND_API_KEY:-}" ] && [ -n "${SMTP_SENDER:-}" ]; then
            body=$(echo "$body" | jq --arg k "$RESEND_API_KEY" --arg f "$SMTP_SENDER" \
              '. + {smtp_host: "smtp.resend.com", smtp_port: "465", smtp_user: "resend", smtp_pass: $k, smtp_admin_email: $f, smtp_sender_name: "Moments", rate_limit_email_sent: 100}')
            echo "SMTP: Resend will send the emails."
          else
            echo "::notice::No RESEND_API_KEY / SMTP_SENDER secret — emails still go through Supabase's built-in test mailer (a few per hour)."
          fi
          code=$(curl -sS -o /tmp/auth.out -w '%{http_code}' -X PATCH "$api" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data "$body")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then head -c 800 /tmp/auth.out; echo; echo "::error::Auth settings were not saved."; exit 1; fi
          echo "allow list now: $(jq -r '.uri_allow_list' /tmp/auth.out)"

      # The runner has the open internet the app's own sandbox does not,
      # so the catalogue is filled here rather than by someone sitting in
      # the app pressing a button. The script refuses anything published
      # after 1928.
      - name: Import public-domain music
        id: music
        if: ${{ inputs.import_music }}
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          TARGET: ${{ inputs.music_target }}
        run: node scripts/import-public-domain-music.mjs

      # Only pictures Commons itself calls public domain or CC0 are
      # copied in; everything else is named in the log and left alone.
      - name: Find pictures for the Egypt quiz
        id: photos
        if: ${{ inputs.import_photos }}
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          DRY_RUN: ${{ inputs.photos_dry_run && '1' || '0' }}
        run: node scripts/import-egypt-photos.mjs

      - name: Install the Supabase CLI
        if: ${{ inputs.deploy_function }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy bardi-chat
        id: deploy
        if: ${{ inputs.deploy_function }}
        run: |
          set -euo pipefail
          supabase functions deploy bardi-chat --project-ref "$REF" --no-verify-jwt
          echo "Function deployed."

      # Set after deploy so the very first invocation already has them.
      - name: Set the function's secrets
        if: ${{ inputs.deploy_function }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SITE_ORIGIN: ${{ inputs.site_origin }}
        run: |
          set -euo pipefail
          supabase secrets set --project-ref "$REF" "ALLOWED_ORIGIN=$SITE_ORIGIN" > /dev/null
          echo "ALLOWED_ORIGIN set to $SITE_ORIGIN"
          if [ -n "${GROQ_API_KEY:-}" ]; then
            supabase secrets set --project-ref "$REF" "GROQ_API_KEY=$GROQ_API_KEY" > /dev/null
            echo "GROQ_API_KEY set."
          else
            echo "::warning::No GROQ_API_KEY secret — Bardi will have no provider until one is added."
          fi

      # Prove it works the way the APP calls it, not just the way curl
      # does. The browser sends an Origin header and a preflight first,
      # so a plain curl can pass while every real user still fails on
      # CORS. Both are checked here.
      - name: Ask Bardi the way the app does
        if: ${{ inputs.deploy_function }}
        env:
          SITE_ORIGIN: ${{ inputs.site_origin }}
          # The anon key is public by design — it is already in the shipped
          # web bundle. It is sent here only to mimic the browser exactly.
          ANON: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2ZGRpeXp0cHl5dXVsdG5kenNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3ODUzOTYsImV4cCI6MjA5OTM2MTM5Nn0.Q4I0ZTuXl_nx9INUV3Knod8Rq5gWQOms0jpDATcX15c'
        run: |
          set -uo pipefail
          url="https://$REF.supabase.co/functions/v1/bardi-chat"

          echo "── 1. preflight (what the browser sends first) ──"
          curl -sS -o /dev/null -D /tmp/pre.h -m 30 -X OPTIONS "$url" \
            -H "Origin: $SITE_ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization, content-type, apikey, x-client-info' || true
          cat /tmp/pre.h
          allow=$(grep -i '^access-control-allow-origin:' /tmp/pre.h | tr -d '\r' | cut -d' ' -f2-)
          echo "allow-origin = '${allow:-<none>}' (need '$SITE_ORIGIN')"

          echo "── 2. the real call, with Origin + the anon key ──"
          body='{"messages":[{"role":"user","content":"Say hi in one short sentence."}],"language":"en"}'
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/bardi.out -D /tmp/bardi.h -w '%{http_code}' -m 45 \
              -X POST "$url" \
              -H 'Content-Type: application/json' \
              -H "Origin: $SITE_ORIGIN" \
              -H "apikey: $ANON" \
              -H "Authorization: Bearer $ANON" \
              -H 'x-client-info: supabase-js-web/2.0.0' \
              --data "$body" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Bardi replied:"
              jq -r '.reply' /tmp/bardi.out
              if [ "$allow" != "$SITE_ORIGIN" ]; then
                echo "::error::Bardi answers, but the preflight does not allow $SITE_ORIGIN — every browser call will be blocked."
                exit 1
              fi
              echo "CORS is correct too."
              exit 0
            fi
            echo "attempt $i → HTTP $code"
            grep -i '^access-control-allow-origin:' /tmp/bardi.h || echo "(no allow-origin header)"
            head -c 600 /tmp/bardi.out; echo
            sleep 10
          done
          echo "::error::bardi-chat is deployed but did not answer. The status and message above say why (503 = no provider key set)."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Moments backend"
            echo ""
            # what actually happened, not what was asked for: a step that
            # failed or never ran says so
            say() { case "$1" in success) echo "$2";; skipped|"") echo "skipped";; *) echo "FAILED — see the log above";; esac; }
            echo "- Database schema: $(say '${{ steps.sql.outcome }}' applied)"
            echo "- Reset link allow list: $(say '${{ steps.auth.outcome }}' updated)"
            echo "- bardi-chat: $(say '${{ steps.deploy.outcome }}' deployed)"
            echo "- music import: $(say '${{ steps.music.outcome }}' ran)"
            echo "- quiz pictures: $(say '${{ steps.photos.outcome }}' ran)"
          } >> "$GITHUB_STEP_SUMMARY"
