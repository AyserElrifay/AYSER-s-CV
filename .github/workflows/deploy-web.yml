name: Deploy Moments web to GitHub Pages

# Builds the Expo web bundle and publishes it to GitHub Pages so the
# app is playable at https://<owner>.github.io/AYSER-s-CV/
# One-time setup: repo Settings → Pages → Build and deployment →
# Source: "GitHub Actions".

on:
  push:
    branches:
      - claude/moments-refactor-architecture-w7zjt4
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # A component rendered without being imported bundles fine and
      # only throws when that branch runs — so it ships. Not any more.
      - name: Check every rendered component exists
        run: node scripts/check-undefined.mjs
      # Two faults that build cleanly and only show up on a real phone:
      # a component declared inside another component (rebuilt from
      # scratch on every render — this is what made the group name box
      # take one letter), and a style object that captured the light
      # theme at import (the white-on-white buttons in dark mode).
      - name: Check for rebuilt components and frozen themes
        run: node scripts/check-rerender.mjs
      # The scoreboard is the product. If the rules drift, the game is
      # over before anybody notices — so the rules are checked, not
      # trusted.
      - name: Check the Lamma scoring rules
        run: node scripts/check-lamma.mjs
      # Nobody using this app should ever read the name of a table, or
      # be told to run a SQL file. Both kept happening because the raw
      # message was right there and easier to pass along than a sentence.
      - name: Check the plumbing stays out of sight
        run: node scripts/check-leaks.mjs
      # A key added to English is a key owed to twelve other languages.
      # The fallback hides the gap, which is how thirty-one keys came to
      # exist only in English and Arabic without anybody noticing.
      - name: Check every language says everything
        run: node scripts/check-i18n.mjs
      # A reel is three minutes; a long-form video is not. The cap was
      # applied to both, so anything longer was re-encoded in real time
      # and cut — or refused with a reel's message. Catching that used
      # to need a twenty-minute file in a browser, which is why it
      # survived for months. It is one pure function now.
      - name: Check a long video is allowed to be long
        run: node scripts/check-video-plan.mjs
      # A video in the feed was a black rectangle with "WATCH ·
      # undefined" written on it — for as long as videos have existed.
      # An <Image> handed an .mp4 draws nothing, and a chip built by
      # gluing a string to a field nobody ever filled prints the word
      # for the absence. Both are checkable with no browser at all.
      - name: Check a video card shows a picture and reads right
        run: node scripts/check-video-card.mjs
      # The map draws its own labels now, which is the only way it can
      # draw them in the language somebody chose. That means every
      # label is a decision, and a style has a few hundred layers —
      # so this asserts that every one carrying text was rewritten,
      # and that the old picture map is still underneath if any of it
      # fails.
      - name: Check the map speaks the app's language
        run: node scripts/check-map-language.mjs
      # A feed that autoplays everything it scrolls past can spend a
      # monthly data bundle in an afternoon, and the person it happens
      # to never sees the moment it happened. This is the rule about
      # what may play and what may be downloaded before anybody asks.
      - name: Check nobody's data bundle gets spent for them
        run: node scripts/check-data-saver.mjs
      # Every clip got a cover already — whatever was on screen a
      # quarter of a second in, which on a phone is very often the
      # frame before the exposure settled. A cover that is a picture of
      # nothing is why a posted reel looked like a black tile.
      - name: Check a video's cover is a picture of something
        run: node scripts/check-cover.mjs
      # Almost nobody writes a hashtag, so the rooms sat empty while the
      # posts that belonged in them sat in the feed. This is the lexicon
      # that reads a caption — and the rule that a post it cannot place
      # goes to For You rather than to nowhere.
      - name: Check an untagged post still lands somewhere
        run: node scripts/check-classify.mjs
      # A track from the music hub is licensed for everybody. The sound
      # somebody RECORDED belongs to them, and whether anybody may build
      # on it is their switch. Getting that backwards hands a person's
      # voice to strangers.
      - name: Check a recorded sound stays its owner's
        run: node scripts/check-sound.mjs
      # An installed web app's back gesture is the browser's back, and
      # the browser knows nothing about a sheet opened by setting a
      # state variable. Back therefore did nothing, or left the app —
      # and the little grey bar every sheet drew was decoration.
      - name: Check a sheet closes the way the phone says
        run: node scripts/check-sheet-back.mjs
      # A ScrollView on the web eats the tap that dismisses the
      # keyboard, so with a field focused the first press on a button
      # did nothing and only a long press got through. The setting does
      # not inherit, which is why it looked random.
      - name: Check a button works on the first tap
        run: node scripts/check-tap.mjs
      # The reset email was sent, the link worked, and the app dropped
      # the token on the floor. Forgetting your password was a closed
      # door with nothing on screen to say so.
      - name: Check forgetting your password is not a dead end
        run: node scripts/check-recovery.mjs
      # "ما ينفعش يبقي اسود" — a clip with no cover drew a black box,
      # and black reads as a video that failed.
      - name: Check no video card is a black rectangle
        run: node scripts/check-poster.mjs
      # "الكود معمول await ... بيرجع تاني من الأول". Independent queries
      # awaited one by one, every login renewal reloading 56 screens,
      # a feed that waited for the splash and then for a second query.
      - name: Check nothing waits when it does not have to
        run: node scripts/check-loading.mjs
      # "You're like N people around the world" — the competitor said
      # 102,192 to a forty-second-old account. Ours says what it counted.
      - name: Check the people-like-you number is a count
        run: node scripts/check-kindred.mjs
      # Lamma rooms subscribed to two tables that were never published for
      # realtime, so "live" meant "within five seconds, by polling".
      - name: Check every live subscription has something to hear
        run: node scripts/check-live-rooms.mjs
      # The map shows real gatherings at real points, a post opens the map
      # where it happened, and nothing on the way invents a place or a ride.
      - name: Check the map, the feed and the welcome page tell the truth
        run: node scripts/check-map-activities.mjs
      # Anything that covers the screen shows a way out — the back
      # gesture alone strands anyone who does not know it.
      - name: Check every screen has a way out you can see
        run: node scripts/check-exits.mjs
      # Together is what Moments is for: the real week near you, five
      # tabs, and Reels/Chill kept with a way back.
      - name: Check the Together tab
        run: node scripts/check-together.mjs
      # An icon-only button must have a name a screen reader can say.
      - name: Check every icon button has a name
        run: node scripts/check-a11y.mjs
      # Going out is one tap; messaging strangers and big plans are earned.
      - name: Check go out now and the care check
        run: node scripts/check-go-now.mjs
      # The feed only holds things you could go to, each with a button, and ends.
      - name: Check the action feed
        run: node scripts/check-action-feed.mjs
      # Bardi is an invisible facilitator, not a chatbot.
      - name: Check Bardi stays out of the way
        run: node scripts/check-bardi.mjs
      # The brain dump: a messy line in, one thing out, nothing leaves but a word.
      - name: Check the brain dump
        run: node scripts/check-brain-dump.mjs
      # Talk rooms: anchored, time-boxed, small, ending in a real meetup.
      - name: Check talk rooms
        run: node scripts/check-talk-rooms.mjs
      # Chats: coming plans first, last week's folded away.
      - name: Check the chats list
        run: node scripts/check-chat-list.mjs
      # Every security hole found so far, kept shut.
      - name: Check security
        run: node scripts/check-security.mjs
      # Community XP: earned by showing up, and nothing else.
      - name: Check community XP
        run: node scripts/check-xp.mjs
      # Notifications: one line per thing that happened.
      - name: Check notification grouping
        run: node scripts/check-notif-groups.mjs
      # Films: a few picked for you, a reason to meet, where they stream.
      - name: Check film picks
        run: node scripts/check-film-picks.mjs
      # The People lens: everyone real, nobody more exact than they agreed.
      - name: Check the People lens
        run: node scripts/check-people-map.mjs
      # Suggestions: location is the gate; friends and interests rank inside it.
      - name: Check suggestions
        run: node scripts/check-recommend.mjs
      # A welcome from the founder: once, new accounts only, words from the database.
      - name: Check the founder's welcome
        run: node scripts/check-founder.mjs
      # Plan photos: real ones only, from our storage, reportable.
      - name: Check plan photos
        run: node scripts/check-plan-photos.mjs
      # Public places: a free photo of that very place, credited, or none.
      - name: Check place photos
        run: node scripts/check-commons-photo.mjs
      # Places: what people really shared there, and posts that belong to a place.
      - name: Check place voices
        run: node scripts/check-place-voices.mjs
      # Guides and hosts: checked by a person, papers private, every plan says who runs it.
      - name: Check guides and hosts
        run: node scripts/check-hosts.mjs
      # No signal must not mean no app.
      - name: Check the app works offline
        run: node scripts/check-offline.mjs
      # Push: only what matters, nothing private on a lock screen.
      - name: Check phone notifications
        run: node scripts/check-push.mjs
      # The country room is content, and content rots differently from
      # code: a country added in a hurry with eight phrases and no
      # customs crashes nothing, it just quietly becomes the thin,
      # half-finished thing that stops somebody trusting the app.
      - name: Check every country room is complete
        run: node scripts/check-country-room.mjs
      # Every place, note and country name we know about used to be a
      # live DOM node on the map at all times — 328 of them, on screen
      # or not. Leaflet rewrites a transform on each one when you pinch,
      # so a zoom dropped ten frames and froze for 150ms on a phone-
      # class CPU. Markers are culled to the view now; a new one added
      # straight to the layer would bring the stutter back silently.
      - name: Check every map marker goes through the cull
        run: node scripts/check-map-cull.mjs
      # `t` is the translator. Where a component already had a prop
      # called t — a track, a tag — calling t('key') binds to that
      # instead and throws the first time that branch renders. The build
      # is happy either way, which is exactly why this is checked.
      - name: Check t is always the translator
        run: node scripts/check-shadowed-t.mjs
      # Lamma lets you pick the language you play in. A chip for a
      # language the questions were never written in shows English and
      # says nothing — so the picker is checked against the pack itself.
      - name: Check the game is written in every language it offers
        run: node scripts/check-lamma-languages.mjs
      # The setup file says "safe to re-run" and twice it was not. One
      # failed statement takes the rest of the file with it, which is
      # how Lamma sat in the repository for days without being on.
      - name: Check the setup file survives being run twice
        env:
          # Here, a skip is a failure. The first time this ran it
          # finished in three seconds without a database and passed.
          SQL_CHECK_REQUIRED: '1'
        run: |
          # The runner image ships PostgreSQL; install it only if this
          # one does not, so the usual build stays fast.
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-16
          fi
          bash scripts/check-sql-twice.sh
      # A group's wall is where somebody says something to their people
      # and not to everybody. A policy that reads correctly and behaves
      # differently is the only kind of bug that matters there, because
      # nobody would ever see it.
      - name: Check a private group is really private
        env:
          SQL_CHECK_REQUIRED: '1'
        run: bash scripts/check-group-rules.sh
      # Landing tells somebody who has just arrived in a country what to
      # do first, and missing some of those deadlines costs money or a
      # residence permit. So the rule that keeps it honest — nothing one
      # person wrote reaches a newcomer until two people have vouched
      # for it, and editing a step costs it that standing — is checked
      # rather than trusted.
      - name: Check a stranger's guess cannot look like fact
        env:
          SQL_CHECK_REQUIRED: '1'
        run: bash scripts/check-landing-rules.sh
      - name: Export web bundle
        run: npx expo export --platform web --output-dir dist
      - name: Inject PWA manifest + Open Graph tags
        run: node scripts/inject-html.mjs dist
      # The app is cut into pieces that arrive when they are opened, and
      # two ordinary-looking lines silently put it back together: an
      # import of a whole directory, or one screen still importing a
      # shared piece the eager way (Metro then moves it back into the
      # file everybody downloads, leaving its chunk at 0 bytes). Both
      # cost about a second of staring at nothing on a phone, and
      # neither shows up in a diff. So the number is checked.
      - name: Check the first download has not crept back up
        run: node scripts/check-first-download.mjs dist
      - name: Disable Jekyll (keep _expo folder)
        run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          # Enable Pages automatically (source = GitHub Actions) so no
          # manual Settings → Pages toggle is required.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Only main publishes. Pushing the feature branch and main within a
  # second of each other had the two runs fighting over one Pages
  # deployment: one cancelled the other, the survivor was refused, and
  # the site quietly stayed on the previous build while both pushes
  # looked fine. The branch still builds (that's the check that matters);
  # main is what goes live.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
