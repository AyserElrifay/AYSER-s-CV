name: Deploy Moments web to GitHub Pages

# Builds the Expo web bundle and publishes it to GitHub Pages so the
# app is playable at https://<owner>.github.io/AYSER-s-CV/
# One-time setup: repo Settings → Pages → Build and deployment →
# Source: "GitHub Actions".

on:
  push:
    branches:
      - claude/moments-refactor-architecture-w7zjt4
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # A component rendered without being imported bundles fine and
      # only throws when that branch runs — so it ships. Not any more.
      - name: Check every rendered component exists
        run: node scripts/check-undefined.mjs
      # Two faults that build cleanly and only show up on a real phone:
      # a component declared inside another component (rebuilt from
      # scratch on every render — this is what made the group name box
      # take one letter), and a style object that captured the light
      # theme at import (the white-on-white buttons in dark mode).
      - name: Check for rebuilt components and frozen themes
        run: node scripts/check-rerender.mjs
      # The scoreboard is the product. If the rules drift, the game is
      # over before anybody notices — so the rules are checked, not
      # trusted.
      - name: Check the Lamma scoring rules
        run: node scripts/check-lamma.mjs
      # Nobody using this app should ever read the name of a table, or
      # be told to run a SQL file. Both kept happening because the raw
      # message was right there and easier to pass along than a sentence.
      - name: Check the plumbing stays out of sight
        run: node scripts/check-leaks.mjs
      # A key added to English is a key owed to twelve other languages.
      # The fallback hides the gap, which is how thirty-one keys came to
      # exist only in English and Arabic without anybody noticing.
      - name: Check every language says everything
        run: node scripts/check-i18n.mjs
      # `t` is the translator. Where a component already had a prop
      # called t — a track, a tag — calling t('key') binds to that
      # instead and throws the first time that branch renders. The build
      # is happy either way, which is exactly why this is checked.
      - name: Check t is always the translator
        run: node scripts/check-shadowed-t.mjs
      - name: Export web bundle
        run: npx expo export --platform web --output-dir dist
      - name: Inject PWA manifest + Open Graph tags
        run: node scripts/inject-html.mjs dist
      - name: Disable Jekyll (keep _expo folder)
        run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          # Enable Pages automatically (source = GitHub Actions) so no
          # manual Settings → Pages toggle is required.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Only main publishes. Pushing the feature branch and main within a
  # second of each other had the two runs fighting over one Pages
  # deployment: one cancelled the other, the survivor was refused, and
  # the site quietly stayed on the previous build while both pushes
  # looked fine. The branch still builds (that's the check that matters);
  # main is what goes live.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
