name: Build Moments for Android

# Moments for Android is the website in a Trusted Web Activity (android/):
# full screen, the Moments icon, therealmoments.com links open in it.
# This builds and signs the APK, puts it on the "android-latest" release,
# and redeploys the site so https://therealmoments.com/android/ serves it
# (deploy-web.yml copies it in, with the Digital Asset Links file that
# lets Android show the site without a browser bar).
#
# Signing: Android only updates an app signed with the same key. Add two
# repository secrets once and every build uses them:
#   ANDROID_KEYSTORE_B64       the keystore, base64
#   ANDROID_KEYSTORE_PASSWORD  its password
# Without them each build signs with a fresh key that is thrown away with
# the runner (never saved anywhere): the APK installs fine, but a phone
# that has an older one must uninstall it before installing the new one.
# The app is the website, so a new APK is rarely needed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/moments.jks"
          if [ -n "${KS_B64:-}" ] && [ -n "${KS_SECRET:-}" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            PASS="$KS_SECRET"
            echo "Using the saved signing key."
          else
            PASS=$(openssl rand -hex 16)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$KS" -alias moments -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Moments, O=The Real Moments, C=EG" >/dev/null
            echo "::warning::No ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets: signed with a one-time key. Phones with an older Moments APK must uninstall it first."
          fi
          echo "KS_PATH=$KS" >> "$GITHUB_ENV"
          echo "KS_PASS=$PASS" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: android
        run: |
          export VERSION_CODE=$(( $(date +%s) / 60 - 29000000 ))
          export VERSION_NAME="1.0.$GITHUB_RUN_NUMBER"
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/moments.apk"
          ls -l "$RUNNER_TEMP/moments.apk"

      # Android trusts the site to be this app (no browser bar) only if the
      # site names the app's signing key: /.well-known/assetlinks.json
      - name: Digital Asset Links
        run: |
          set -euo pipefail
          SHA=$(keytool -list -v -keystore "$KS_PATH" -alias moments -storepass "$KS_PASS" | awk '/SHA256:/ {print $2; exit}')
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.therealmoments.app","sha256_cert_fingerprints":["%s"]}}]\n' "$SHA" > "$RUNNER_TEMP/assetlinks.json"
          cat "$RUNNER_TEMP/assetlinks.json"

      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --title "Moments for Android" --notes "The latest Moments APK. Download it from https://therealmoments.com/android/" --latest=false
          gh release upload android-latest "$RUNNER_TEMP/moments.apk" "$RUNNER_TEMP/assetlinks.json" --clobber

      # a push made with this workflow's token starts no other workflow,
      # so the site is redeployed by hand to pick the new APK up
      - name: Redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --ref main
