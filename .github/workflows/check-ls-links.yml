name: Check the store's checkout links

# Opens every Lemon Squeezy checkout link the app uses (and any passed in
# by hand) and prints which product, plan and price each one really sells,
# so a link is never put on the wrong button by guessing. The links are
# public; nothing secret is used.

on:
  workflow_dispatch:
    inputs:
      extra:
        description: 'More checkout links to look at, separated by spaces'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: What each link sells
        env:
          EXTRA: ${{ inputs.extra }}
        run: |
          npm i --no-save --no-package-lock playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          links="$(grep -oE 'https://therealmoments\.lemonsqueezy\.com/checkout/buy/[0-9a-f-]+' src/services/payments.js) $EXTRA"
          LINKS="$links" node -e '
            const { chromium } = require("playwright");
            (async () => {
              const b = await chromium.launch();
              for (const u of process.env.LINKS.split(/\s+/).filter(Boolean)) {
                const p = await b.newPage();
                try {
                  await p.goto(u, { waitUntil: "networkidle", timeout: 45000 });
                  await p.waitForTimeout(3000);
                  const t = (await p.innerText("body")).replace(/\s+/g, " ").slice(0, 400);
                  console.log(u.split("/").pop() + " → " + t);
                } catch (e) { console.log(u.split("/").pop() + " → could not open: " + e.message.split("\n")[0]); }
                await p.close();
              }
              await b.close();
            })();
          ' | tee -a "$GITHUB_STEP_SUMMARY"
