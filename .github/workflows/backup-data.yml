name: Back up Moments data

# Ayser, November 2026: "عشان لو حصلت حاجة". Every Monday (and on the
# button) the rows people made — accounts without passwords, posts,
# bookings, chats, settings — are read through the Supabase Management
# API (scripts/backup-data.sh), LOCKED with a passphrase only Ayser
# knows, and kept here as a download for 90 days (about 13 weeks back).
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN — already set (the backend workflow uses it)
#   BACKUP_PASSPHRASE     — a long passphrase YOU choose (Settings →
#                           Secrets and variables → Actions → New secret).
#                           Without it nothing is uploaded: people's data
#                           never leaves unlocked. Keep a copy of it
#                           somewhere safe — without it the backup cannot
#                           be opened, by anybody.
#
# To open a backup: download the artifact, then
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in moments-data.sql.gz.enc -out moments-data.sql.gz
#   gunzip moments-data.sql.gz
# To restore: run supabase/RUN_ME.sql on the new project, then the whole
# of moments-data.sql in its SQL editor. Photos and videos in Storage are
# not in this file (they are files, not rows).

on:
  schedule:
    - cron: '17 2 * * 1'   # Mondays 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-data
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      REF: dvddiyztpyyuultndzso
    steps:
      - uses: actions/checkout@v4

      - name: Both secrets are there
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN is not set."; exit 1; fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE is not set — add one in Settings → Secrets and variables → Actions. Nothing is backed up unlocked."
            exit 1
          fi

      - name: Read every table
        run: bash scripts/backup-data.sh "$RUNNER_TEMP/bk"

      - name: Lock it
        run: |
          D=$(date -u +%Y-%m-%d)
          mkdir -p out
          gzip -9 -c "$RUNNER_TEMP/bk/restore.sql" \
            | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:BACKUP_PASSPHRASE -out "out/moments-data-$D.sql.gz.enc"
          cp "$RUNNER_TEMP/bk/counts.txt" "out/rows-per-table-$D.txt"
          rm -rf "$RUNNER_TEMP/bk"
          # the lock opens again with the same passphrase (checked here, so a bad backup is never kept silently)
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_PASSPHRASE -in "out/moments-data-$D.sql.gz.enc" | gunzip | head -c 64 | grep -q 'Moments data backup'
          ls -la out
          {
            echo "### Moments data backup — $D"
            echo ""
            echo "- locked file: moments-data-$D.sql.gz.enc ($(du -h out/*.enc | cut -f1))"
            echo "- tables: $(wc -l < out/rows-per-table-$D.txt), rows: $(awk '{s+=$2} END {print s}' out/rows-per-table-$D.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: moments-data-backup
          path: out/
          retention-days: 90
          if-no-files-found: error
