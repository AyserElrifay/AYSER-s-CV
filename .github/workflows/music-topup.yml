name: Top up the music library

# The library grows on its own. Every night this looks for recordings
# published in 1928 or earlier that aren't in the catalogue yet and
# adds them, so nobody has to remember to do it.
#
# It stops once the library reaches CEILING, because a library nobody
# can finish scrolling is not better than one they can — and because
# storage and the Archive's bandwidth are both real.
#
# Needs the SUPABASE_ACCESS_TOKEN repository secret, same as the setup
# workflow. Can also be run by hand with a different size.

on:
  schedule:
    - cron: '0 3 * * *'      # 03:00 UTC, quiet hours in Cairo
  workflow_dispatch:
    inputs:
      target:
        description: 'How many new tracks to add this run'
        required: true
        default: '500'
      ceiling:
        description: 'Stop when the library is this big'
        required: true
        default: '5000'

permissions:
  contents: read

concurrency:
  group: music-topup
  cancel-in-progress: false

jobs:
  topup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dvddiyztpyyuultndzso
      TARGET: ${{ inputs.target || '500' }}
      CEILING: ${{ inputs.ceiling || '5000' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is missing — nothing to do."
            exit 1
          fi

      # Don't grow forever just because the schedule fired.
      - name: Stop if the library is already big enough
        id: size
        run: |
          set -euo pipefail
          n=$(curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"query":"select count(*)::int as n from public.tracks"}' | jq -r '.[0].n // 0')
          echo "library holds $n tracks (ceiling $CEILING)"
          if [ "$n" -ge "$CEILING" ]; then
            echo "full=yes" >> "$GITHUB_OUTPUT"
          else
            echo "full=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Import more public-domain recordings
        if: steps.size.outputs.full == 'no'
        run: node scripts/import-public-domain-music.mjs

      - name: Summary
        if: always()
        run: |
          {
            echo "### Music top-up"
            echo ""
            echo "- ceiling: $CEILING"
            echo "- ${{ steps.size.outputs.full == 'yes' && 'library already full — skipped' || 'imported up to ' }}${{ steps.size.outputs.full == 'yes' && '' || env.TARGET }}"
          } >> "$GITHUB_STEP_SUMMARY"
