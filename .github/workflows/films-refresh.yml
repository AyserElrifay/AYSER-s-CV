name: Refresh the film catalogue

# Films change every week — what's trending, what just landed, what
# people are actually watching in Egypt. This keeps the catalogue
# current on its own rather than freezing on the day it was built.
#
# Needs one repository secret:
#   SUPABASE_ACCESS_TOKEN — same one the setup workflow uses
# TMDB_KEY is optional: with it the catalogue gains backdrops, real
# audience scores and proper genres. Without it the shelf still fills,
# from Apple's open film catalogue, which needs no key at all.
#
# The key lives here and never ships in the app: the browser reads
# films from our own table, so the catalogue works even when the
# upstream API doesn't.

on:
  schedule:
    - cron: '0 4 * * *'      # 04:00 UTC, after the music top-up
  workflow_dispatch:
    inputs:
      pages:
        description: 'Pages to pull per source (20 films each)'
        required: true
        default: '6'

permissions:
  contents: read

concurrency:
  group: films-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TMDB_KEY: ${{ secrets.TMDB_KEY }}
      PROJECT_REF: dvddiyztpyyuultndzso
      PAGES: ${{ inputs.pages || '6' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secret is there
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi
          if [ -z "$TMDB_KEY" ]; then
            echo "No TMDB_KEY — filling from Apple's open catalogue instead. Add TMDB_KEY later for backdrops and audience scores."
          fi

      - name: Import films
        run: node scripts/import-films.mjs
