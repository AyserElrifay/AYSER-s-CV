name: Refresh the film catalogue

# Films change every week — what's trending, what just landed, what
# people are actually watching in Egypt. This keeps the catalogue
# current on its own rather than freezing on the day it was built.
#
# Needs two repository secrets:
#   SUPABASE_ACCESS_TOKEN — same one the setup workflow uses
#   TMDB_KEY              — free from themoviedb.org/settings/api
#
# The key lives here and never ships in the app: the browser reads
# films from our own table, so the catalogue works even when the
# upstream API doesn't.

on:
  schedule:
    - cron: '0 4 * * *'      # 04:00 UTC, after the music top-up
  workflow_dispatch:
    inputs:
      pages:
        description: 'Pages to pull per source (20 films each)'
        required: true
        default: '6'

permissions:
  contents: read

concurrency:
  group: films-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TMDB_KEY: ${{ secrets.TMDB_KEY }}
      PROJECT_REF: dvddiyztpyyuultndzso
      PAGES: ${{ inputs.pages || '6' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are there
        run: |
          missing=0
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && { echo "::error::SUPABASE_ACCESS_TOKEN is missing."; missing=1; }
          [ -z "$TMDB_KEY" ] && { echo "::error::TMDB_KEY is missing — get a free key at https://www.themoviedb.org/settings/api and add it as a repository secret."; missing=1; }
          exit $missing

      - name: Import films
        run: node scripts/import-films.mjs
