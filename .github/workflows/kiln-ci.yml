name: Kiln CI

# Kiln lives in kiln/ and shares nothing with the Moments app at the repository
# root, so this workflow only runs when Kiln itself changes.
on:
  push:
    paths:
      - 'kiln/**'
      - '.github/workflows/kiln-ci.yml'
  pull_request:
    paths:
      - 'kiln/**'
      - '.github/workflows/kiln-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: kiln

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        # The isolation suite needs a real Postgres. There is no meaningful way
        # to test row-level security against anything else.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: kiln_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ADMIN_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/kiln_test
      TEST_ADMIN_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/kiln_test
      TEST_DATABASE_URL: postgres://kiln_app:ci-app-password@127.0.0.1:5432/kiln_test
      DATABASE_URL: postgres://kiln_app:ci-app-password@127.0.0.1:5432/kiln_test
      KILN_APP_DB_PASSWORD: ci-app-password
      AUTH_SECRET: ci-only-secret-not-used-anywhere-real
      AUTH_TRUST_HOST: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kiln/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The route suite runs against `next start`, so the build has to come
      # first. It also catches anything that typechecks but will not bundle.
      - name: Build
        run: npm run build

      - name: Migrate the test database
        run: npm run db:migrate

      # Isolation is the gate. If org A can read org B by any route, nothing
      # else in this repository matters.
      - name: Test
        run: npm test
